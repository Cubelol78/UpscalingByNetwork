version: '3.8'

# ==============================================================================
# UpscalingByNetwork - Production Docker Compose
# ==============================================================================
# Features:
# - Multi-stage optimized builds
# - Named volumes for persistence
# - Separate networks for frontend/backend
# - Resource limits
# - Health checks
# - Security hardening
# - GPU support (optional)
# ==============================================================================

services:
  # ============================================================================
  # Server Service (CPU-only)
  # ============================================================================
  upscaling-server:
    image: upscaling-server:latest
    container_name: upscaling-server
    build:
      context: ..
      dockerfile: docker/Dockerfile.server-optimized
      args:
        SERVER_PORT: 8888
        GPU_SUPPORT: "false"

    # Network configuration
    networks:
      frontend:
        ipv4_address: 172.28.0.10
      backend:
        ipv4_address: 172.29.0.10

    # Port mapping
    ports:
      - "8888:8888"

    # Environment variables
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8888
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - MAX_CLIENTS=50
      - BATCH_SIZE=50

    # Environment file (for secrets)
    env_file:
      - .env

    # Volume mounts
    volumes:
      # Input data (read-only)
      - upscaling-input:/home/upscaling/data/input:ro
      # Output data (read-write)
      - upscaling-output:/home/upscaling/data/output:rw
      # Temporary processing (tmpfs for speed)
      - type: tmpfs
        target: /home/upscaling/data/temp
        tmpfs:
          size: 10G
      # Configuration (read-only)
      - ./config:/home/upscaling/config:ro
      # Logs (bind mount for easy access)
      - ./logs:/home/upscaling/data/logs:rw
      # Models cache
      - upscaling-models:/home/upscaling/.cache/realesrgan:rw

    # Health check
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost', 8888)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Restart policy
    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

    # Security options
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default

    # Capability restrictions
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # User
    user: "1000:1000"

    # PID limits
    pids_limit: 200

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=upscaling-server"

    # Labels
    labels:
      com.upscaling.service: "server"
      com.upscaling.version: "2.0"
      com.upscaling.environment: "production"


  # ============================================================================
  # Server Service (GPU-enabled) - Alternative
  # ============================================================================
  upscaling-server-gpu:
    image: upscaling-server-gpu:latest
    container_name: upscaling-server-gpu
    build:
      context: ..
      dockerfile: docker/Dockerfile.server-gpu

    # GPU runtime
    runtime: nvidia

    # GPU environment
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,video
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8888
      - LOG_LEVEL=INFO

    # Networks
    networks:
      - frontend
      - backend

    # Ports
    ports:
      - "8888:8888"

    # Volumes (same as CPU version)
    volumes:
      - upscaling-input:/home/upscaling/data/input:ro
      - upscaling-output:/home/upscaling/data/output:rw
      - type: tmpfs
        target: /home/upscaling/data/temp
        tmpfs:
          size: 10G
      - ./config:/home/upscaling/config:ro
      - ./logs:/home/upscaling/data/logs:rw
      - upscaling-models:/home/upscaling/.cache/realesrgan:rw

    # GPU device access
    devices:
      - /dev/dri:/dev/dri

    # Resource limits with GPU
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]

    # Health check
    healthcheck:
      test: ["CMD-SHELL", "nvidia-smi && python3 -c 'import socket; s=socket.socket(); s.connect((\"localhost\", 8888)); s.close()'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    restart: unless-stopped

    # Disable by default (enable manually)
    profiles:
      - gpu


# ==============================================================================
# Networks
# ==============================================================================
networks:
  # Frontend network (for client connections)
  frontend:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
    driver_opts:
      com.docker.network.bridge.name: upscale_frontend
      com.docker.network.driver.mtu: 1500

  # Backend network (internal services only)
  backend:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/16
          gateway: 172.29.0.1
    driver_opts:
      com.docker.network.bridge.name: upscale_backend


# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  # Input data volume
  upscaling-input:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${INPUT_DIR:-./data/input}

  # Output data volume
  upscaling-output:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${OUTPUT_DIR:-./data/output}

  # Models cache volume
  upscaling-models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MODELS_DIR:-./data/models}
