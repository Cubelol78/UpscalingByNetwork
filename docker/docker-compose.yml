# UpscalingByNetwork/docker/docker-compose.yml

version: '3.8'

services:
  upscaling-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: upscaling-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./data:/home/upscaling/data
      - ./config:/home/upscaling/UpscalingByNetwork/config
    environment:
      - DISPLAY=:99
      - PYTHONUNBUFFERED=1
    networks:
      - upscaling-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8888)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  upscaling-network:
    driver: bridge

volumes:
  upscaling-data:
    driver: local