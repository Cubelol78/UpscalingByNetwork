version: '3.8'

services:
  upscaling-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upscaling-server
    restart: unless-stopped

    # Environment variables
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8888
      - SERVER_MODE=headless  # Options: headless, cli, daemon
      - LOG_LEVEL=INFO        # Options: DEBUG, INFO, WARNING, ERROR

    # Ports
    ports:
      - "8888:8888"

    # Volumes
    volumes:
      - ./logs:/app/server/logs
      - ./output:/app/server/output
      - ./server_work:/app/server/server_work
      - ./config:/config

    # Resource limits (optional, adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 2G

    # Healthcheck
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8888)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Network
    networks:
      - upscaling-network

networks:
  upscaling-network:
    driver: bridge
